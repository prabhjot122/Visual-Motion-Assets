<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LawVriksh reel — End card</title>
<meta name="lv:template" content="reel/end-card">
<meta name="lv:size" content="1080x1920">
<meta name="lv:fps" content="30">
<meta name="lv:duration" content="4.5">

<link rel="stylesheet" href="../core/lv.css">

<body>
<main class="lv" data-format="reel" data-theme="dark">
<div class="reel-top"><span class="mark"><img src="../../brand/logos/lawvriksh-mark.png" alt="LawVriksh"></span><span class="wordmark">Law<span>Vriksh</span></span><span class="counter" data-slot="reel_counter">02 / 07</span></div>

  <div class="endmark"><img src="../../brand/logos/lawvriksh-mark.png" alt="LawVriksh"></div>
  <div class="gap-s"></div>
  <p class="end-word">Law<span>Vriksh</span></p>
  <div class="gap-l"></div>
  <h1 class="statement l" data-slot-html="title_html">Prepare your case with <b>facts you can check.</b></h1>
  <div class="gap-l"></div>
  <span class="btn" data-slot="button">Follow for the next note</span>
  <div class="gap-s"></div>
  <p class="note" data-slot="note" data-optional>One practice note for advocates, every week.</p>
  <div class="push"></div>
</section><div class="cap ink-band" data-cap aria-live="off"><div class="cap-line"></div></div>
</main>
<script>
