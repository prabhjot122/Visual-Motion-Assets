<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LawVriksh static — Principle card (1200x1200)</title>
<meta name="lv:template" content="static/principle-card-li">
<meta name="lv:size" content="1200x1200">
<meta name="lv:role" content="static">
<link rel="stylesheet" href="../core/lv.css">
<link rel="stylesheet" href="static.css">
<script src="../core/lv-runtime.js"></script>
<script src="../core/lv-objects.js"></script>
</head>
<body>
<main class="lv" data-format="square" data-theme="paper">
<div class="motif" data-motif="courthouse" data-deco aria-hidden="true" style="left:60px;top:70px;width:560px;height:380px"></div>
<section class="content">
  <div class="push"></div>
  <p class="principle-no" data-slot="number">Principle 04</p>
  <div class="gap-s"></div>
  <h1 class="statement xl" data-slot-html="title_html">Your judgment stays <b>yours.</b></h1>
  <div class="gap-m"></div>
  <p class="support" data-slot-html="body_html" data-optional>A tool can find and sort. Whether a case helps your client is still your call.</p>
</section>
<div class="thread is-static" aria-hidden="true" style="--progress-x:var(--safe-x)"></div>
<footer class="folio">
  <span class="mark"><img src="../../brand/logos/lawvriksh-mark.png" alt="LawVriksh"></span>
  <span class="wordmark">Law<span>Vriksh</span></span>
  <span class="series" data-slot="series">Field notes</span>
</footer>
</main>

</html>
