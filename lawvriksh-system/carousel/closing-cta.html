<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LawVriksh carousel — Closing / CTA</title>
<meta name="lv:template" content="carousel/closing-cta">
<meta name="lv:size" content="1080x1350">
<meta name="lv:role" content="closing">
<link rel="stylesheet" href="../core/lv.css">
<link rel="stylesheet" href="carousel.css">
<script src="../core/lv-runtime.js"></script>
<script src="../core/lv-objects.js"></script>
</head>
<body>
<main class="lv" data-format="portrait" data-theme="paper" data-counter="8/8">
<div class="motif" data-motif="reports" data-deco aria-hidden="true" style="left:600px;top:60px;width:440px;height:300px"></div>
<section class="content">
  <p class="kicker" data-slot="kicker">Next week</p>
  <div class="push"></div>
  <h1 class="statement xl" data-slot-html="title_html">Prepare your case with <b>facts you can check.</b></h1>
  <div class="gap-m"></div>
  <p class="support" data-slot-html="body_html" data-optional>One practice note for individual advocates, every week.</p>
  <div class="gap-l"></div>
  <span class="btn" data-slot="button">Follow for the next note</span>
  <div class="gap-s"></div>
  <p class="note" data-slot="note" data-optional>Save this carousel for your next filing.</p>
</section>

<div class="thread" aria-hidden="true"></div>
<footer class="folio">
  <span class="mark"><img src="../../brand/logos/lawvriksh-mark.png" alt="LawVriksh"></span>
  <span class="wordmark">Law<span>Vriksh</span></span>
  <span class="counter" data-slot="counter">08 / 08</span>
</footer>
</main>
</body>
</html>
