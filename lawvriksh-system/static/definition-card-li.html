<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LawVriksh static — Definition card (1200x1200)</title>
<meta name="lv:template" content="static/definition-card-li">
<meta name="lv:size" content="1200x1200">
<meta name="lv:role" content="static">
<link rel="stylesheet" href="../core/lv.css">
<link rel="stylesheet" href="static.css">
<script src="../core/lv-runtime.js"></script>
<script src="../core/lv-objects.js"></script>
</head>
<body>
<main class="lv" data-format="square" data-theme="paper">
<section class="content">
  <p class="kicker" data-slot="kicker">Plain terms</p>
  <div class="push"></div>
  <div class="term-line"><h1 class="statement l" data-slot="term" style="margin:0">Authorised source</h1><span class="pos" data-slot="pos">noun</span></div>
  <div class="gap-s"></div>
  <p class="support" data-slot-html="body_html" data-optional>Where a judgment is published by the court or an official reporter, and can be read in full.</p>
  <div class="gap-l"></div>
  <hr class="rule">
  <div class="gap-m"></div>
  <p class="label" data-slot="not_label" style="color:var(--accent)">Does not settle</p>
  <div class="gap-s"></div>
  <p class="body" data-slot="not_text">Whether the case is still good law.</p>
</section>
<div class="motif" data-motif="reports" data-deco aria-hidden="true" style="left:840px;top:40px;width:300px;height:210px"></div>
<div class="thread is-static" aria-hidden="true" style="--progress-x:var(--safe-x)"></div>
<footer class="folio">
  <span class="mark"><img src="../../brand/logos/lawvriksh-mark.png" alt="LawVriksh"></span>
  <span class="wordmark">Law<span>Vriksh</span></span>
  <span class="series" data-slot="series">Field notes</span>
</footer>
</main>
</body>
</html>
