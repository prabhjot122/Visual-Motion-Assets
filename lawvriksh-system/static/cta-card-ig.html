<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LawVriksh static — CTA card (1080x1350)</title>
<meta name="lv:template" content="static/cta-card-ig">
<meta name="lv:size" content="1080x1350">
<meta name="lv:role" content="static">
<link rel="stylesheet" href="../core/lv.css">
<link rel="stylesheet" href="static.css">
<script src="../core/lv-runtime.js"></script>
<script src="../core/lv-objects.js"></script>
</head>
<body>
<main class="lv" data-format="portrait" data-theme="paper">
<div class="motif" data-motif="reports" data-deco aria-hidden="true" style="left:560px;top:50px;width:480px;height:330px"></div>
<section class="content">
  <div class="push"></div>
  <div class="cta-card">
    <h1 class="statement m" data-slot-html="title_html">One practice note, <b>every week.</b></h1>
    <div class="gap-s"></div>
    <p class="support" data-slot-html="body_html" data-optional>Short, checkable habits for individual advocates.</p>
    <div class="gap-m"></div>
    <span class="btn" data-slot="button">Follow LawVriksh</span>
    <div class="gap-s"></div>
    <p class="note" data-slot="note" data-optional>Save this for your next filing.</p>
  </div>
</section>
<div class="thread is-static" aria-hidden="true" style="--progress-x:var(--safe-x)"></div>
<footer class="folio">
  <span class="mark"><img src="../../brand/logos/lawvriksh-mark.png" alt="LawVriksh"></span>
  <span class="wordmark">Law<span>Vriksh</span></span>
  <span class="series" data-slot="series">Field notes</span>
</footer>
</main>
</body>
</html>
