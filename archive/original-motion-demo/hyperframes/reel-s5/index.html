<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>LawVriksh web cut — section 5</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    @font-face { font-family: 'Newsreader'; src: url(assets/fonts/web-newsreader-500.woff2) format('woff2'); font-weight: 500; }
    @font-face { font-family: 'Newsreader'; src: url(assets/fonts/web-newsreader-500-italic.woff2) format('woff2'); font-weight: 500; font-style: italic; }
    @font-face { font-family: 'Figtree'; src: url(assets/fonts/figtree.woff2) format('woff2'); font-weight: 300 900; }
    @font-face { font-family: 'Newsreader'; src: url(assets/fonts/newsreader-400.woff2) format('woff2'); font-weight: 400; }
    @font-face { font-family: 'Newsreader'; src: url(assets/fonts/newsreader-400-italic.woff2) format('woff2'); font-weight: 400; font-style: italic; }
    @font-face { font-family: 'Instrument Serif'; src: url(assets/fonts/instrument-serif.woff2) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; src: url(assets/fonts/instrument-serif-italic.woff2) format('woff2'); font-style: italic; }

    html, body { margin: 0; width: 100%; height: 100%; background: #efebe3; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #efebe3 url(assets/textures/paper.jpg) center / cover; font-family: 'Figtree', sans-serif; color: #171717; }
    .layer { position: absolute; left: 0; top: 0; width: 1440px; height: 1000px; pointer-events: none; }
    #light { overflow: hidden; }
    #bands { position: absolute; left: -200px; top: -300px; width: 1900px; height: 1600px; display: flex; gap: 70px; padding-left: 520px; filter: blur(26px); mix-blend-mode: soft-light; transform: rotate(-24deg); }
    #bands i { display: block; width: 90px; height: 100%; background: rgba(255, 226, 180, 0.9); }
    #bands i:nth-child(even) { width: 130px; }
    #vignette { background: radial-gradient(120% 90% at 70% 30%, rgba(255,236,210,0) 55%, rgba(70,45,25,0.16) 100%); }
    .clay { background-image: url(assets/textures/stone-clay.jpg); background-size: 600px; }
    .char { background-image: url(assets/textures/stone-char.jpg); background-size: 600px; }
    .sand { background-image: url(assets/textures/stone-sand.jpg); background-size: 600px; }
    .hatch { background-image: url(assets/textures/hatch-sand.jpg); background-size: 520px; }
    .deco { position: absolute; left: 0; top: 0; }

    #plate { position: absolute; left: 0; top: 0; width: 1440px; height: 1000px; background: url(assets/plates/timeline-exit.png) 0 0 / 1440px 1000px; transform-origin: 720px 1000px; }
    #slab { position: absolute; left: 0; top: -40px; width: 1900px; height: 1080px; clip-path: polygon(114px 0, 100% 0, calc(100% - 80px) 100%, 0 100%); }

    .word { position: absolute; left: 0; top: 0; font-family: 'Newsreader', serif; font-weight: 400; line-height: 1; letter-spacing: -0.035em; color: #1c1714; white-space: nowrap; }
    .word em { font-style: italic; color: #a93a18; }
    .mask { position: absolute; overflow: hidden; }
    .wordmark { font-family: 'Instrument Serif', serif; line-height: 1; color: #1c1714; white-space: nowrap; }
    .wordmark .v { font-style: italic; color: #a93a18; }

    /* The Ask screen (rebuilt from d11 / the saved Arora Ask session) */
    #win { position: absolute; left: 0; top: 0; border-radius: 18px; overflow: hidden; background: #faf9f6; border: 1px solid #e7e5e2; box-shadow: 0 3px 10px rgba(20,16,12,0.08), 0 40px 90px rgba(40,24,10,0.28); }
    #win-content { position: absolute; left: 0; top: 0; width: 1160px; height: 800px; }
    .whead { position: absolute; left: 0; top: 0; width: 1160px; height: 64px; border-bottom: 1px solid #eeeae3; background: #fff; }
    .btn { position: absolute; display: flex; align-items: center; height: 34px; padding: 0 13px; box-sizing: border-box; border: 1px solid #e4ded4; border-radius: 8px; background: #fff; font-size: 14.5px; color: #3a352f; }
    .toggle { position: absolute; left: 480px; top: 13px; display: flex; padding: 3px; border-radius: 999px; border: 1px solid #e4ded4; background: #f5f1ea; font-size: 14.5px; }
    .toggle span { padding: 7px 18px; border-radius: 999px; color: #606060; }
    .toggle span.on { background: #c94820; color: #fff; font-weight: 600; }
    #bubble { position: absolute; left: 0; top: 0; padding: 16px 20px; box-sizing: border-box; border-radius: 12px; background: #f1eee9; font-size: 16px; color: #171717; white-space: nowrap; transform-origin: 0 0; }
    #glyph { position: absolute; left: 101px; top: 146px; width: 22px; height: 22px; }
    #ans-head { position: absolute; left: 101px; top: 180px; font-size: 21px; font-weight: 600; color: #171717; }
    #answer { position: absolute; left: 101px; top: 220px; width: 900px; margin: 0; font-size: 16.5px; line-height: 31px; color: #2b2722; }
    #answer span { opacity: 0; }
    #answer b { font-weight: 700; color: #171717; position: relative; }
    #answer b i { position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: #c94820; transform-origin: 0 50%; transform: scaleX(0); }
    #cites { position: absolute; left: 101px; top: 338px; width: 900px; height: 180px; box-sizing: border-box; padding: 18px 18px 0; border: 1px solid #ebe7e0; border-radius: 12px; background: #fff; box-shadow: 0 2px 8px rgba(20,16,12,0.05); }
    #cites h4 { margin: 0 0 18px; font-size: 16px; font-weight: 600; color: #171717; }
    .crow { display: flex; align-items: center; gap: 12px; height: 42px; font-size: 15.5px; color: #3a352f; }
    .crow b { margin-left: auto; width: 20px; height: 20px; border-radius: 999px; background: #f6dcd3; color: #c94820; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; }

    /* The prompt box: large on the bare stage, then the Ask screen's own composer */
    #composer { position: absolute; left: 0; top: 0; width: 850px; height: 94px; box-sizing: border-box; border: 1px solid #f0d9cf; border-radius: 16px; background: #fff; box-shadow: 0 10px 30px rgba(201,72,32,0.08), 0 2px 6px rgba(20,16,12,0.06); transform-origin: 0 0; }
    #ph { position: absolute; left: 19px; top: 17px; font-size: 15px; color: #9a9a9a; }
    #typed { position: absolute; left: 19px; top: 17px; font-size: 15px; color: #171717; white-space: nowrap; }
    #caret { display: inline-block; width: 1.5px; height: 17px; margin-left: 1px; vertical-align: -3px; background: #c94820; }
    .chips { position: absolute; left: 18px; top: 50px; display: flex; gap: 10px; align-items: center; }
    .chip { height: 30px; padding: 0 12px; box-sizing: border-box; display: flex; align-items: center; border: 1px solid #e4ded4; border-radius: 8px; background: #fff; font-size: 13.5px; color: #3a352f; white-space: nowrap; }
    #model { position: absolute; right: 56px; top: 50px; }
    #send { position: absolute; right: 16px; top: 50px; width: 30px; height: 30px; border-radius: 999px; background: #c94820; display: flex; align-items: center; justify-content: center; }
  
    /* Web cut: replaced by the caption stream and its transitions */
    #ask-mask, #slab-layer { display: none !important; }
    #film { overflow: hidden; }
    #bug { display: none !important; } /* the frame label carries the brand; no corner mark popping in and out between parts */
    #reelcam { position: absolute; left: 0; top: 0; width: 1440px; height: 1000px; transform-origin: 0 0; }
  #captions { display: none !important; }
  #lawyer { display: none !important; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="reel-s5" data-start="0" data-width="1080" data-height="1920" data-fps="30" data-duration="3.0">
    <div id="reelcam"><div class="layer" id="film">
    <div class="layer" id="light"><div id="bands"><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="layer" id="stage">
      <div class="deco hatch" id="d-hatch" style="width:50px; height:670px"></div>
      <div class="deco clay" id="d-arc" style="width:260px; height:160px; clip-path: path('M0 0 H260 V160 H150 A100 100 0 0 0 50 50 H0 Z')"></div>
      <div class="mask" id="ask-mask" style="left:52px; top:4px; width:600px; height:260px"><div class="word" id="ask-word" style="top:8px; font-size:236px">Ask<em>.</em></div></div>
      <div id="stones"></div>
      <div id="win"><div id="win-content">
        <div class="whead"><div class="btn" style="left:23px; top:15px">Chat History</div><div class="toggle"><span class="on">Ask</span><span>Draft</span></div></div>
        <svg id="glyph" viewBox="0 0 22 22" aria-hidden="true"></svg>
        <div id="ans-head">Direct answer</div>
        <p id="answer"></p>
        <div id="cites"><h4>Citations</h4>
          <div class="crow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3a352f" stroke-width="1.6"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>Amount outstanding<b>1</b></div>
          <div class="crow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3a352f" stroke-width="1.6"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>Amount outstanding<b>2</b></div>
          <div class="crow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3a352f" stroke-width="1.6"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>Total consideration<b>3</b></div>
        </div>
      </div></div>
      <div id="bubble">What is the outstanding amount we are claiming, and is it consistent across the record?</div>
      <div id="composer">
        <div id="ph">Ask a legal query</div>
        <div id="typed"><span id="typed-text"></span><span id="caret"></span></div>
        <div class="chips"><div class="chip" style="width:32px; justify-content:center; padding:0">+</div><div class="chip">Arora v. Meridian Estates Pv…</div><div class="chip">Deep</div></div>
        <div class="chip" id="model">Model</div>
        <div id="send"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
      </div>
      <svg class="layer" id="ink" width="1440" height="1000" viewBox="0 0 1440 1000" aria-hidden="true">
        <path id="focal" fill="none" stroke="#1c1714" stroke-width="2" stroke-linecap="square"/>
        <circle id="click-ring" r="0" fill="none" stroke="#c94820" stroke-width="2"/>
      </svg>
    </div>
    <div class="layer" id="plate-layer"><div id="plate"></div></div>
    <svg class="layer" id="rail-layer" width="1440" height="1000" viewBox="0 0 1440 1000" aria-hidden="true"><path id="rail" fill="none" stroke="#c4562e" stroke-width="2.4" stroke-linecap="round"/></svg>
    <svg id="cursor" width="22" height="30" viewBox="0 0 22 30" style="position:absolute; left:0; top:0"><path d="M2 2 L2 24 L8 18 L12 28 L16 26 L12 16 L20 16 Z" fill="#171717" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <div class="layer" id="type"><div class="wordmark" id="bug" style="position:absolute; right:40px; top:0; font-size:30px">Law<span class="v">Vriksh</span></div></div>
    <div class="layer" id="slab-layer"><div class="sand" id="slab"></div></div>
    <div class="layer" id="vignette"></div>
    </div>
    </div>
    <div class="layer" id="captions"></div>
  </div>
  <script type="module">
    import { timeline } from './src/shot.js';
    window.__timelines['reel-s5'] = timeline;
  </script>
</body>
</html>
