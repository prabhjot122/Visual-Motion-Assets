<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LawVriksh carousel — Advocate series — cover</title>
<meta name="lv:template" content="carousel/advocate-cover">
<meta name="lv:size" content="1080x1350">
<meta name="lv:role" content="series cover">
<link rel="stylesheet" href="../core/lv.css">
<link rel="stylesheet" href="carousel.css">
<script src="../core/lv-runtime.js"></script>
<script src="../core/lv-objects.js"></script>
</head>
<body>
<main class="lv" data-format="portrait" data-theme="paper" data-counter="1/5">
<section class="content adv-cover">
  <p class="kicker" data-slot="kicker">Advocates who shaped practice · No. [n]</p>
  <div class="gap-m"></div>
  <figure class="slot-frame portrait" style="margin:0"><img data-slot-src="image" data-slot-alt="image_alt" alt="" data-hidden><span class="slot-label" data-slot="image_label">Portrait — public-domain or licensed image</span></figure>
  <div class="push"></div>
  <h1 class="statement m" data-slot="name">[Advocate name]</h1>
  <div class="gap-s"></div>
  <p class="era" data-slot="era">[Year]–[Year] · [Bar / city]</p>
</section>

<div class="thread" aria-hidden="true"></div>
<footer class="folio">
  <span class="mark"><img src="../../brand/logos/lawvriksh-mark.png" alt="LawVriksh"></span>
  <span class="wordmark">Law<span>Vriksh</span></span>
  <span class="counter" data-slot="counter">01 / 05</span>
</footer>
</main>
</body>
</html>
