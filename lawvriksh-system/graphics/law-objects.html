<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LawVriksh graphics — law objects</title>
<meta name="lv:template" content="graphics/law-objects">
<meta name="lv:size" content="1800x1500">
<link rel="stylesheet" href="../core/lv.css">
<script src="../core/lv-runtime.js"></script>
<script src="../core/lv-objects.js"></script>
<style>
.lv{width:1800px;height:1500px}
.grid{position:absolute;inset:72px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:40px;z-index:2}
.cell{display:flex;flex-direction:column;gap:20px;min-width:0}
.cell .motif{position:relative;flex:1;min-height:0}
.cell .motif svg{width:100%;height:100%;display:block}
.cell p{margin:0;font-size:34px;font-weight:500;color:var(--fg)}
</style>
</head>
<body>
<main class="lv" data-format="sheet" data-theme="paper">
<div class="grid">
<div class="cell"><div class="motif" data-motif="reports" data-deco></div><p>reports</p></div>
<div class="cell"><div class="motif" data-motif="files" data-deco></div><p>files</p></div>
<div class="cell"><div class="motif" data-motif="checked" data-deco></div><p>checked</p></div>
<div class="cell"><div class="motif" data-motif="open-book" data-deco></div><p>open-book</p></div>
<div class="cell"><div class="motif" data-motif="courthouse" data-deco></div><p>courthouse</p></div>
<div class="cell"><div class="motif" data-motif="calendar" data-deco></div><p>calendar</p></div>
<div class="cell"><div class="motif" data-motif="notes" data-deco></div><p>notes</p></div>
<div class="cell"><div class="motif" data-motif="compare" data-deco></div><p>compare</p></div>
<div class="cell"><div class="motif" data-motif="judgment" data-deco></div><p>judgment</p></div>
<div class="cell"><div class="motif" data-motif="register" data-deco></div><p>register</p></div>
</div>
</main>
</body>
</html>
