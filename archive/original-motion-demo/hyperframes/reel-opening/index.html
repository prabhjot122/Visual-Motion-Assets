<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>LawVriksh web cut — opening</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    @font-face { font-family: 'Newsreader'; src: url(assets/fonts/newsreader-500.woff2) format('woff2'); font-weight: 500; }
    @font-face { font-family: 'Newsreader'; src: url(assets/fonts/newsreader-500-italic.woff2) format('woff2'); font-weight: 500; font-style: italic; }
    @font-face { font-family: 'Newsreader'; src: url(assets/fonts/newsreader-300-italic.woff2) format('woff2'); font-weight: 300; font-style: italic; }
    @font-face { font-family: 'Figtree'; src: url(assets/fonts/figtree.woff2) format('woff2'); font-weight: 300 900; }
    @font-face { font-family: 'Newsreader'; src: url(assets/fonts/newsreader-400.woff2) format('woff2'); font-weight: 400; }
    @font-face { font-family: 'Newsreader'; src: url(assets/fonts/newsreader-400-italic.woff2) format('woff2'); font-weight: 400; font-style: italic; }
    @font-face { font-family: 'Instrument Serif'; src: url(assets/fonts/instrument-serif.woff2) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; src: url(assets/fonts/instrument-serif-italic.woff2) format('woff2'); font-style: italic; }

    html, body { margin: 0; width: 100%; height: 100%; background: #efebe3; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #efebe3; font-family: 'Figtree', sans-serif; color: #1c1714; }
    .layer { position: absolute; left: 0; top: 0; width: 1440px; height: 1000px; pointer-events: none; }
    #gl { display: block; width: 1440px; height: 1000px; }
    #veil { background: #efebe3 url(assets/textures/paper.jpg) center / cover; opacity: 0; }

    /* Window light (Frame C): five soft bands at -24deg, soft-light. */
    #light { overflow: hidden; }
    #bands { position: absolute; left: -200px; top: -300px; width: 1900px; height: 1600px; display: flex; gap: 70px; padding-left: 520px; filter: blur(26px); mix-blend-mode: soft-light; transform: rotate(-24deg); }
    #bands i { display: block; width: 90px; height: 100%; background: rgba(255, 226, 180, 0.9); }
    #bands i:nth-child(even) { width: 130px; }
    #sweep { position: absolute; left: 0; top: -300px; width: 220px; height: 1600px; background: rgba(255, 230, 190, 0.85); filter: blur(40px); mix-blend-mode: soft-light; transform-origin: 50% 50%; }
    #vignette { background: radial-gradient(120% 90% at 70% 30%, rgba(255,236,210,0) 55%, rgba(70,45,25,0.16) 100%); }

    /* Footage (0–1.85 s only). Children are laid out in base canvas pixels. */
    #footage-world { position: absolute; left: 0; top: 0; width: 1440px; height: 1000px; transform-origin: 0 0; }
    #lawyer { position: absolute; left: -18.52px; top: 0; width: 1770.37px; height: 1000px; }
    #bezel-patch { position: absolute; left: 749px; top: 696px; width: 42px; height: 9px; border-radius: 3px; background: linear-gradient(#232222, #302f2f); filter: blur(0.7px); transform: rotate(-6deg); }
    #sheet { position: absolute; left: 0; top: 0; width: 300px; height: 410px; transform-origin: 0 0; background-size: 100% 100%; opacity: 0; }

    .word { position: absolute; font-family: 'Newsreader', serif; font-weight: 400; line-height: 1; letter-spacing: -0.035em; color: #1c1714; white-space: nowrap; }
    .word em { font-style: italic; color: #a93a18; }
    .mask { position: absolute; overflow: hidden; }
    .wordmark { font-family: 'Instrument Serif', serif; line-height: 1; color: #1c1714; white-space: nowrap; }
    .wordmark .v { font-style: italic; color: #a93a18; }
    .wordmark span { display: inline-block; }
    .amt { position: absolute; left: 0; top: 0; font-family: 'Newsreader', serif; font-weight: 500; font-size: 104px; line-height: 1; letter-spacing: -0.03em; white-space: nowrap; color: #1c1714; transform-origin: 0 0; }
    .plabel { position: absolute; left: 0; top: 0; font-family: 'Newsreader', serif; font-style: italic; font-size: 22px; color: #3a352f; white-space: nowrap; }
    .tag { position: absolute; left: 0; top: 0; padding: 9px 14px 8px 18px; background: #fbf8f2; border: 1px solid #e4ddd1; box-shadow: 0 10px 24px rgba(40,24,10,0.18); font-family: 'Newsreader', serif; font-size: 28px; line-height: 1; color: #1c1714; white-space: nowrap; transform-origin: 0 50%; }
    .tag::before { content: ''; position: absolute; left: -7px; top: 50%; width: 10px; height: 10px; margin-top: -7px; border-radius: 999px; border: 2px solid #2b2522; background: #efebe3; }
    .tag small { font-family: 'Figtree', sans-serif; font-size: 12px; color: #858585; margin-left: 8px; }
    /* 2D stage (after the stacks): pages, stones, tablets, folder — the approved stills' language */
    .card { position: absolute; left: 0; top: 0; background: #fff no-repeat 0 0 / 100% 100%; box-shadow: 0 2px 4px rgba(40,24,10,0.12), 0 36px 80px rgba(40,24,10,0.30); transform-origin: 50% 50%; will-change: transform; }
    .hl { position: absolute; background: rgba(201,72,32,0.22); border-bottom: 2px solid #c94820; transform-origin: 0 50%; }
    .stone { position: absolute; left: 0; top: 0; }
    .stone > i { position: absolute; display: block; background-size: 600px; }
    .clay { background-image: url(assets/textures/stone-clay.jpg); }
    .char { background-image: url(assets/textures/stone-char.jpg); }
    .sand { background-image: url(assets/textures/stone-sand.jpg); }
    .tablet { position: absolute; left: 0; top: 0; padding: 14px 20px 12px; color: #fbf4ec; background-size: 600px; box-shadow: 0 18px 40px rgba(40,24,10,0.32); transform-origin: 50% 100%; white-space: nowrap; }
    .tablet b { display: block; font-family: 'Newsreader', serif; font-weight: 500; font-size: 44px; line-height: 1; letter-spacing: -0.02em; }
    .tablet span { font-size: 12.5px; letter-spacing: 0.02em; opacity: 0.85; }
    .tablet.sand { color: #1c1714; }
    #folder { position: absolute; left: 570px; top: 270px; width: 300px; height: 400px; perspective: 1400px; transform-origin: 50% 50%; }
    #folder .base, #folder .cover { position: absolute; inset: 0; background-size: 600px; box-shadow: 0 30px 70px rgba(40,24,10,0.30); }
    #folder .inner { position: absolute; left: 14px; top: 14px; right: 14px; bottom: 14px; background: #fbf8f2 no-repeat 0 0 / 100% 100%; box-shadow: inset 0 0 0 1px rgba(60,45,30,0.12); }
    #folder .cover { transform-origin: 0 50%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
    #folder .cover::after { content: ''; position: absolute; left: 0; right: 0; top: 62%; height: 3px; background: rgba(140,40,20,0.75); }
    #folder .flabel { position: relative; z-index: 1; width: 236px; padding: 16px 0 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: #f6efe2; box-shadow: 0 1px 2px rgba(40,24,10,0.25), inset 0 0 0 1px rgba(60,40,25,0.18); transform: translateY(-34px) rotate(-1.5deg); }
    #folder .cover b { font-family: 'Newsreader', serif; font-style: italic; font-weight: 400; font-size: 29px; color: #2b2522; white-space: nowrap; }
    #folder .cover span { font-family: 'Newsreader', serif; font-style: italic; font-size: 17px; color: #4a3f36; }
    #folder .fshadow { position: absolute; left: 10px; top: 18px; width: 300px; height: 400px; background: rgba(40,24,10,0.30); filter: blur(18px); }
    #folder .fedge-b { position: absolute; left: 0; top: 400px; width: 310px; height: 10px; background-size: 600px; clip-path: polygon(0 0, 300px 0, 310px 10px, 10px 10px); filter: brightness(0.55); }
    #folder .fedge-r { position: absolute; left: 300px; top: 0; width: 10px; height: 410px; background-size: 600px; clip-path: polygon(0 0, 10px 10px, 10px 410px, 0 400px); filter: brightness(0.72); }
    .hatch { background-image: url(assets/textures/hatch-sand.jpg); background-size: 520px; }
    #stage2d, #ink, #back-type { transform-origin: 0 0; }
    #stage2d { z-index: 0; } /* own stacking context: its children's z-index never rises above the ink or type */
    .sheet2d { position: absolute; left: 0; top: 0; background: #fbf8f2 no-repeat 0 0 / 100% 100%; transform-origin: 50% 50%; }
    .slip { position: absolute; left: 0; top: 0; width: 230px; height: 200px; background-size: 600px; box-shadow: 0 18px 40px rgba(40,24,10,0.28); transform-origin: 50% 50%; }
    .frag, .chip { position: absolute; left: 0; top: 0; background-size: 600px; transform-origin: 50% 50%; }
    .frag { width: 0; height: 0; }
    .frag.clay { width: 170px; height: 120px; } .frag.char { width: 140px; height: 110px; } .frag.hatch { width: 110px; height: 46px; background-size: 520px; } .frag.sand { width: 120px; height: 70px; }
    .chip { box-shadow: 0 8px 18px rgba(40,24,10,0.25); }
    .loose { position: absolute; left: 0; top: 0; width: 150px; height: 205px; background: #fbf8f2 no-repeat 0 0 / 100% 100%; box-shadow: 0 2px 4px rgba(40,24,10,0.12), 0 24px 50px rgba(40,24,10,0.25); transform-origin: 50% 50%; }
    #window { position: absolute; left: 160px; top: 150px; width: 1120px; height: 0; border-radius: 0 0 18px 18px; background: #fbfaf7; border: 1px solid #e7e5e2; border-top: 0; box-shadow: 0 3px 10px rgba(20,16,12,0.08), 0 40px 90px rgba(40,24,10,0.28); opacity: 0; }
  
    /* Web cut: the one-word titles give way to the caption sentences (web-cut-plan.md §3) */
    #type .mask > .word, #back-type { visibility: hidden !important; }
    #film { overflow: hidden; }
    #bug { display: none !important; } /* the frame label carries the brand; no corner mark popping in and out between parts */
    #reelcam { position: absolute; left: 0; top: 0; width: 1440px; height: 1000px; transform-origin: 0 0; }
  #captions { display: none !important; }
  #lawyer { display: none !important; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="reel-opening" data-start="0" data-width="1080" data-height="1920" data-fps="30" data-duration="17.4667">
    <div id="reelcam"><div class="layer" id="film">
    <div class="layer" id="three-host"><canvas id="gl" width="1440" height="1000"></canvas></div>
    <div class="layer" id="veil"></div>
    <div class="layer" id="light"><div id="bands"><i></i><i></i><i></i><i></i><i></i></div><div id="sweep"></div></div>
    <!-- Behind the pages (p5-p6): the outline word of the timeline beat -->
    <div class="layer" id="back-type">
      <div class="mask" id="timeline-mask" style="left: 20px; top: 300px; width: 0; height: 360px">
        <svg width="1420" height="360" viewBox="0 0 1420 360" aria-hidden="true"><text x="10" y="300" font-family="Newsreader" font-size="330" letter-spacing="-11" fill="none" stroke="rgba(28,23,20,0.5)" stroke-width="1.6">Timeline<tspan fill="none" stroke="rgba(169,58,24,0.8)" font-style="italic">.</tspan></text></svg></div>
    </div>

    <div class="layer" id="footage-layer">
      <div id="footage-world">
        <video id="lawyer" class="clip" data-start="0" data-duration="1.95" data-media-start="0.5" src="assets/footage/lawyer-office-v3.mp4" muted playsinline></video>
        <div id="bezel-patch"></div>
      </div>
      <div id="sheet"></div>
    </div>

    <div class="layer" id="stage2d"></div>

    <svg class="layer" id="ink" width="1440" height="1000" viewBox="0 0 1440 1000" aria-hidden="true">
      <defs>
        <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/></filter>
      </defs>
      <g id="pencil-layer" filter="url(#pencil)" fill="none" stroke="#2b2522" stroke-linecap="round" stroke-linejoin="round"></g>
      <g id="clay-layer" fill="none" stroke="#c4562e" stroke-linecap="round" stroke-linejoin="round"></g>
      <g id="mark-layer" fill="none" stroke="#1c1714" stroke-width="2" stroke-linecap="square"></g>
    </svg>

    <div class="layer" id="type"></div>
    <div class="layer" id="vignette"></div>
    </div>
    </div>
    <div class="layer" id="captions"></div>

  </div>
  <script type="module">
    import { timeline } from './src/shot.js';
    window.__timelines['reel-opening'] = timeline;
  </script>
</body>
</html>
