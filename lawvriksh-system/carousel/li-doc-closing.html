<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LawVriksh carousel — LinkedIn document — closing</title>
<meta name="lv:template" content="carousel/li-doc-closing">
<meta name="lv:size" content="1080x1350">
<meta name="lv:role" content="document closing">
<link rel="stylesheet" href="../core/lv.css">
<link rel="stylesheet" href="carousel.css">
<script src="../core/lv-runtime.js"></script>
<script src="../core/lv-objects.js"></script>
</head>
<body>
<main class="lv" data-format="portrait" data-theme="paper" data-counter="7/7">
<section class="content">
  <p class="kicker" data-slot="kicker">Keep this</p>
  <div class="push"></div>
  <h1 class="statement xl" data-slot-html="title_html">Four lines per citation. <b>Every filing.</b></h1>
  <div class="gap-m"></div>
  <p class="support" data-slot-html="body_html" data-optional>Source, paragraph, court, date and parties, then a note of what you checked.</p>
  <div class="gap-l"></div>
  <span class="btn" data-slot="button">Follow LawVriksh</span>
  <div class="gap-s"></div>
  <p class="note" data-slot="note" data-optional>A practice note for individual advocates, every week.</p>
</section>
<div class="motif" data-motif="courthouse" data-deco aria-hidden="true" style="left:620px;top:60px;width:420px;height:300px"></div>

<div class="thread" aria-hidden="true"></div>
<footer class="folio">
  <span class="mark"><img src="../../brand/logos/lawvriksh-mark.png" alt="LawVriksh"></span>
  <span class="wordmark">Law<span>Vriksh</span></span>
  <span class="counter" data-slot="counter">07 / 07</span>
</footer>
</main>
</body>
</html>
