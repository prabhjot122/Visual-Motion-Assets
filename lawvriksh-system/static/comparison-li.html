<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LawVriksh static — Comparison (1200x1200)</title>
<meta name="lv:template" content="static/comparison-li">
<meta name="lv:size" content="1200x1200">
<meta name="lv:role" content="static">
<link rel="stylesheet" href="../core/lv.css">
<link rel="stylesheet" href="static.css">
<script src="../core/lv-runtime.js"></script>
<script src="../core/lv-objects.js"></script>
</head>
<body>
<main class="lv" data-format="square" data-theme="paper">
<section class="content">
  <p class="kicker" data-slot="kicker">The paragraph, your sentence</p>
  <div class="gap-m"></div>
  <h1 class="statement m" data-slot-html="title_html">Say <b>no more</b> than the paragraph does.</h1>
  <div class="push"></div>
  <div class="pair">
    <div class="card is-quiet"><span class="pill is-outline" data-slot="a_label">The paragraph</span><p class="body" data-slot="a_text">Para [14]: the notice was served on [date].</p></div>
    <div class="link-h" data-deco aria-hidden="true"></div>
    <div class="card is-raised"><span class="pill is-accent" data-slot="b_label">Your sentence</span><p class="body" data-slot="b_text">Notice was served on [date] (para [14]).</p></div>
  </div>
</section>
<div class="thread is-static" aria-hidden="true" style="--progress-x:var(--safe-x)"></div>
<footer class="folio">
  <span class="mark"><img src="../../brand/logos/lawvriksh-mark.png" alt="LawVriksh"></span>
  <span class="wordmark">Law<span>Vriksh</span></span>
  <span class="series" data-slot="series">Field notes</span>
</footer>
</main>
</body>
</html>
