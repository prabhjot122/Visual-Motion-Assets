<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LawVriksh carousel — Statement with check rows</title>
<meta name="lv:template" content="carousel/statement-checks">
<meta name="lv:size" content="1080x1350">
<meta name="lv:role" content="content">
<link rel="stylesheet" href="../core/lv.css">
<link rel="stylesheet" href="carousel.css">
<script src="../core/lv-runtime.js"></script>
<script src="../core/lv-objects.js"></script>
</head>
<body>
<main class="lv" data-format="portrait" data-theme="paper" data-counter="5/8">
<section class="content">
  <p class="kicker" data-slot="kicker">Check three</p>
  <div class="push"></div>
  <h1 class="statement m" data-slot-html="title_html">Match the <b>court, date and parties.</b></h1>
  <div class="gap-m"></div>
  <ul class="rows" data-slot-list="rows"><template><li class="row"><span class="tick"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M7.5 15.5l5 5 10-11" fill="none" stroke="#f5f1ea" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="txt" data-field="text"></span></li></template>
<li class="row"><span class="tick"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M7.5 15.5l5 5 10-11" fill="none" stroke="#f5f1ea" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="txt">The court is the one your draft names.</span></li>
<li class="row"><span class="tick"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M7.5 15.5l5 5 10-11" fill="none" stroke="#f5f1ea" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="txt">The date is the date your draft gives.</span></li>
<li class="row"><span class="tick"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M7.5 15.5l5 5 10-11" fill="none" stroke="#f5f1ea" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="txt">The parties match your draft.</span></li></ul>
  <div class="gap-m"></div>
  <p class="support" data-slot-html="body_html" data-optional>Any mismatch: <b>stop and recheck.</b></p>
</section>

<div class="thread" aria-hidden="true"></div>
<footer class="folio">
  <span class="mark"><img src="../../brand/logos/lawvriksh-mark.png" alt="LawVriksh"></span>
  <span class="wordmark">Law<span>Vriksh</span></span>
  <span class="counter" data-slot="counter">05 / 08</span>
</footer>
</main>
</body>
</html>
