<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>LawVriksh web cut — section 4</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    @font-face { font-family: 'Newsreader'; src: url(assets/fonts/web-newsreader-500.woff2) format('woff2'); font-weight: 500; }
    @font-face { font-family: 'Newsreader'; src: url(assets/fonts/web-newsreader-500-italic.woff2) format('woff2'); font-weight: 500; font-style: italic; }
    @font-face { font-family: 'Figtree'; src: url(assets/fonts/figtree.woff2) format('woff2'); font-weight: 300 900; }
    @font-face { font-family: 'Newsreader'; src: url(assets/fonts/newsreader-400.woff2) format('woff2'); font-weight: 400; }
    @font-face { font-family: 'Newsreader'; src: url(assets/fonts/newsreader-500.woff2) format('woff2'); font-weight: 500; }
    @font-face { font-family: 'Newsreader'; src: url(assets/fonts/newsreader-400-italic.woff2) format('woff2'); font-weight: 400; font-style: italic; }
    @font-face { font-family: 'Instrument Serif'; src: url(assets/fonts/instrument-serif.woff2) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; src: url(assets/fonts/instrument-serif-italic.woff2) format('woff2'); font-style: italic; }

    html, body { margin: 0; width: 100%; height: 100%; background: #efebe3; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #efebe3 url(assets/textures/paper.jpg) center / cover; font-family: 'Figtree', sans-serif; color: #171717; }
    .layer { position: absolute; left: 0; top: 0; width: 1440px; height: 1000px; pointer-events: none; }
    #light { overflow: hidden; }
    #bands { position: absolute; left: -200px; top: -300px; width: 1900px; height: 1600px; display: flex; gap: 70px; padding-left: 520px; filter: blur(26px); mix-blend-mode: soft-light; transform: rotate(-24deg); }
    #bands i { display: block; width: 90px; height: 100%; background: rgba(255, 226, 180, 0.9); }
    #bands i:nth-child(even) { width: 130px; }
    #vignette { background: radial-gradient(120% 90% at 70% 30%, rgba(255,236,210,0) 55%, rgba(70,45,25,0.16) 100%); }
    .clay { background-image: url(assets/textures/stone-clay.jpg); background-size: 600px; }
    .char { background-image: url(assets/textures/stone-char.jpg); background-size: 600px; }
    .sand { background-image: url(assets/textures/stone-sand.jpg); background-size: 600px; }
    .hatch { background-image: url(assets/textures/hatch-sand.jpg); background-size: 520px; }
    .deco { position: absolute; }

    /* The opening plate: section 3's last frame, which falls away once the date has lifted out of it */
    #plate { position: absolute; left: 0; top: 0; width: 1440px; height: 1000px; background: url(assets/plates/d09-exit.png) 0 0 / 1440px 1000px; transform-origin: 720px 1000px; }
    #date-hl { position: absolute; background: rgba(201,72,32,0.30); border-bottom: 2px solid #c94820; transform-origin: 0 50%; }

    .word { position: absolute; left: 0; top: 0; font-family: 'Newsreader', serif; font-weight: 400; line-height: 1; letter-spacing: -0.035em; color: #1c1714; white-space: nowrap; }
    .word em { font-style: italic; color: #a93a18; }
    .mask { position: absolute; overflow: hidden; }
    .wordmark { font-family: 'Instrument Serif', serif; line-height: 1; color: #1c1714; white-space: nowrap; }
    .wordmark .v { font-style: italic; color: #a93a18; }

    /* P6's paper date tags, landing on the rail */
    .tag { position: absolute; left: 0; top: 0; padding: 8px 13px 7px; background: #fbf8f2; border: 1px solid #e4ddd1; box-shadow: 0 10px 24px rgba(40,24,10,0.18); font-family: 'Newsreader', serif; font-size: 24px; line-height: 1; color: #1c1714; white-space: nowrap; transform-origin: 100% 50%; }
    .tag small { font-family: 'Figtree', sans-serif; font-size: 11px; color: #6b6b6b; margin-left: 7px; }
    .tag.sel { border-color: #c94820; box-shadow: 0 0 0 2px rgba(201,72,32,0.14), 0 10px 24px rgba(40,24,10,0.18); }
    .title { position: absolute; left: 0; top: 0; font-size: 16px; font-weight: 600; color: #1c1714; white-space: nowrap; }
    .title.sel { color: #a93a18; }

    /* the provenance slip for the selected event: the source's own words */
    #slip { position: absolute; left: 0; top: 0; width: 470px; padding: 16px 20px 18px; box-sizing: border-box; background: #fbf8f2; border: 1px solid #e4ddd1; box-shadow: 0 2px 4px rgba(40,24,10,0.10), 0 26px 60px rgba(40,24,10,0.24); }
    #slip .src { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: #6a625a; }
    #slip .src span { margin-left: auto; color: #6b6b6b; font-weight: 400; }
    #slip p { margin: 10px 0 0; font-family: 'Newsreader', serif; font-size: 22px; line-height: 1.38; color: #1c1714; }
    #slip mark { background: rgba(201,72,32,0.26); border-bottom: 2px solid #c94820; color: inherit; padding: 0 1px; }
  
    /* Web cut: replaced by the caption stream and its transitions */
    #timeline-mask { display: none !important; }
    #film { overflow: hidden; }
    #deco-hatch, #deco-sand, #deco-dot { display: none !important; } /* section 3 left these; part 5 opens from the table, which has none */
    #bug { display: none !important; } /* the frame label carries the brand; no corner mark popping in and out between parts */
    #reelcam { position: absolute; left: 0; top: 0; width: 1440px; height: 1000px; transform-origin: 0 0; }
  #captions { display: none !important; }
  #lawyer { display: none !important; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="reel-s4" data-start="0" data-width="1080" data-height="1920" data-fps="30" data-duration="4.4">
    <div id="reelcam"><div class="layer" id="film">
    <div class="layer" id="light"><div id="bands"><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="layer" id="stage">
      <div class="deco hatch" id="deco-hatch" style="left:1376px; top:560px; width:64px; height:480px"></div>
      <div class="mask" id="timeline-mask" style="left:50px; top:14px; width:1100px; height:292px"><div class="word" id="timeline-word" style="top:8px; font-size:236px">Timeline<em>.</em></div></div>
      <div class="layer" id="rows"></div>
      <div id="slip"><div class="src"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="#d65248"/><path d="M14 2v6h6" fill="#f6b1aa"/></svg>Notice invoking arbitration — 14 Mar 2026.pdf<span>Page 1</span></div><p>The Agreement was duly registered before the Sub-Registrar, Vasant Vihar, on <mark id="slip-date">9 February 2023</mark> as Document No. 4127 of 2023.</p></div>
      <svg class="layer" id="ink" width="1440" height="1000" viewBox="0 0 1440 1000" aria-hidden="true">
        <path id="rail" fill="none" stroke="#c4562e" stroke-width="2.4" stroke-linecap="round"/>
        <g id="rings"></g>
        <path id="thread" fill="none" stroke="#c4562e" stroke-width="2.4" stroke-linecap="round"/>
        <path id="focal" fill="none" stroke="#1c1714" stroke-width="2" stroke-linecap="square"/>
      </svg>
      <div class="layer" id="tags"></div>
    </div>
    <div class="layer" id="plate-layer"><div id="plate"><div id="date-hl"></div></div></div>
    <div class="deco sand" id="deco-sand" style="left:1180px; top:-30px; width:300px; height:150px"></div>
    <div class="deco char" id="deco-dot" style="left:1110px; top:40px; width:50px; height:50px; border-radius:999px"></div>
    <div class="layer" id="type"><div class="wordmark" id="bug" style="position:absolute; right:40px; top:150px; font-size:30px">Law<span class="v">Vriksh</span></div></div>
    <div class="layer" id="vignette"></div>
    </div>
    </div>
    <div class="layer" id="captions"></div>
  </div>
  <script type="module">
    import { timeline } from './src/shot.js';
    window.__timelines['reel-s4'] = timeline;
  </script>
</body>
</html>
