<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LawVriksh carousel — Checklist summary</title>
<meta name="lv:template" content="carousel/checklist">
<meta name="lv:size" content="1080x1350">
<meta name="lv:role" content="summary">
<link rel="stylesheet" href="../core/lv.css">
<link rel="stylesheet" href="carousel.css">
<script src="../core/lv-runtime.js"></script>
<script src="../core/lv-objects.js"></script>
</head>
<body>
<main class="lv" data-format="portrait" data-theme="paper" data-counter="8/9">
<section class="content">
  <p class="kicker" data-slot="kicker">Save this</p>
  <div class="gap-m"></div>
  <h1 class="statement l" data-slot-html="title_html">Every citation, <b>every time.</b></h1>
  <div class="push"></div>
  <ol class="rows numlist" data-slot-list="rows"><template><li class="row"><span class="n" data-index-pad></span><span class="txt" data-field="text"></span></li></template>
  <li class="row"><span class="n">01</span><span class="txt">Find it in an authorised source</span></li>
<li class="row"><span class="n">02</span><span class="txt">Read the paragraph it rests on</span></li>
<li class="row"><span class="n">03</span><span class="txt">Match court, date and parties</span></li>
<li class="row"><span class="n">04</span><span class="txt">Note what you checked</span></li></ol>
  <div class="gap-m"></div>
  <p class="note" data-slot="note" data-optional>Four lines. About a minute per citation.</p>
</section>

<div class="thread" aria-hidden="true"></div>
<footer class="folio">
  <span class="mark"><img src="../../brand/logos/lawvriksh-mark.png" alt="LawVriksh"></span>
  <span class="wordmark">Law<span>Vriksh</span></span>
  <span class="counter" data-slot="counter">08 / 09</span>
</footer>
</main>
</body>
</html>
